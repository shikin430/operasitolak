<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuiz Matematik - Operasi Tolak</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:Arial,sans-serif;color:#26334b;background:linear-gradient(135deg,#eaf5ff,#fff5e3)}.wrap{max-width:900px;margin:auto}header,.card,.stat,#result{background:#fff;border-radius:18px;padding:15px;box-shadow:0 4px 14px #20305012}header{text-align:center}h1{font-size:clamp(1.4rem,4vw,2rem);margin:5px}header p{margin:8px}.details,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.details label{flex:1;min-width:145px;font-weight:bold}input{font-size:1rem;border:2px solid #d7e3f4;border-radius:10px;padding:11px;width:100%;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{text-align:center;padding:10px}.stat b{display:block;font-size:1.25rem;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:2px solid #e1eafa}.card h2{font-size:1rem;margin:0 0 8px}.objects{font-size:clamp(1.35rem,4vw,2rem);line-height:1.65;text-align:center;overflow-wrap:anywhere;background:#f7faff;border-radius:12px;padding:8px}.equation{text-align:center;font-size:1.6rem;font-weight:bold;margin:10px}.answer{display:block;max-width:100px;text-align:center;margin:auto;font-size:1.3rem;font-weight:bold}.feedback{text-align:center;min-height:24px;font-weight:bold;margin-top:8px}.correct{background:#effff4;border-color:#70c99a}.wrong{background:#fff1f1;border-color:#eaa}.toolbar button{flex:1}button{border:0;border-radius:12px;padding:12px;font-size:.96rem;font-weight:bold;cursor:pointer}.primary{background:#4776c5;color:#fff}.gold{background:#ffcf62;color:#493700}.secondary{background:#fff;border:2px solid #d7e3f4;color:#26334b}#result{text-align:center;margin:14px 0;font-weight:bold;display:none}.note{text-align:center}.pill{display:inline-block;background:#fff0bd;padding:7px 12px;border-radius:20px;font-weight:bold}@media(max-width:560px){body{padding:8px}.grid{grid-template-columns:1fr}.card{padding:12px}.stat{font-size:.85rem;padding:8px}}@media print{body{background:white;padding:0}.toolbar,.note,.feedback{display:none!important}.grid{grid-template-columns:repeat(2,1fr)}.card,header,.stat{box-shadow:none;break-inside:avoid;border:1px solid #888}#result{display:block!important}}
</style></head><body><main class="wrap">
<header><h1>➖ Kuiz Matematik: Operasi Tolak</h1><p><b>Prasekolah Shining Star</b></p><p>Potong bilangan objek yang ditolak, kemudian kira baki.</p><span class="pill">🌟 Jawab semua 10 soalan!</span></header>
<div class="details"><label>Nama murid<input id="student" placeholder="Tulis nama murid"></label><label>Kelas<input id="className" placeholder="Tulis kelas"></label></div>
<div class="stats"><div class="stat">Markah<b id="score">0 / 10</b></div><div class="stat">Masa<b id="timer">00:00</b></div><div class="stat">Dijawab<b id="answered">0 / 10</b></div></div>
<div class="toolbar"><button class="primary" onclick="checkAll()">✅ Semak Jawapan</button><button class="gold" onclick="finishQuiz()">🏆 Tamat & Lihat Markah</button><button class="secondary" onclick="window.print()">🖨️ Cetak / Save as PDF</button><button class="secondary" onclick="restartQuiz()">🔄 Cuba Semula</button></div>
<div id="result" aria-live="polite"></div><div class="grid" id="questions"></div><p class="note">💡 Kira semua objek dahulu, kemudian tolak bilangan yang diminta. Semoga berjaya, bintang kecil! ⭐</p></main>
<script>
const qs=[{a:6,b:3,e:"🥕"},{a:8,b:4,e:"🍓"},{a:7,b:5,e:"🐟"},{a:9,b:6,e:"🐰"},{a:9,b:8,e:"🍩"},{a:10,b:4,e:"🥥"},{a:10,b:6,e:"🍬"},{a:11,b:5,e:"🍃"},{a:11,b:8,e:"☕"},{a:12,b:5,e:"🥟"}];
const el=id=>document.getElementById(id);let started=Date.now();
function render(){el("questions").innerHTML=qs.map((q,i)=>`<section class="card" id="card${i}"><h2>Soalan ${i+1}</h2><div class="objects">${Array.from({length:q.a},()=>`<span>${q.e}</span>`).join(" ")}</div><div class="equation">${q.a} − ${q.b} =</div><input class="answer" id="ans${i}" type="number" min="0" max="${q.a}" inputmode="numeric" placeholder="?" aria-label="Jawapan soalan ${i+1}"><div class="feedback" id="fb${i}"></div></section>`).join("")}
function beep(freq=600,duration=.16,type="sine"){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.start();o.stop(c.currentTime+duration);o.onended=()=>c.close()}catch(e){}}
function checkAll(){let score=0,answered=0;qs.forEach((q,i)=>{let v=el("ans"+i).value.trim(),c=el("card"+i),f=el("fb"+i);c.classList.remove("correct","wrong");if(v!==""){answered++;if(Number(v)===q.a-q.b){score++;c.classList.add("correct");f.textContent="🎉 Tahniah! Jawapan betul. Good job!";}else{c.classList.add("wrong");f.textContent="💪 Cuba lagi! Kira baki objek selepas ditolak.";}}else f.textContent="Belum dijawab.";});el("score").textContent=`${score} / ${qs.length}`;el("answered").textContent=`${answered} / ${qs.length}`;if(score===qs.length) {beep(660,.12);setTimeout(()=>beep(880,.18),140)}else beep(220,.25,"square");return{score,answered}}
function finishQuiz(){let r=checkAll(),n=el("student").value.trim()||"Murid",s=Math.floor((Date.now()-started)/1000);el("result").style.display="block";el("result").innerHTML=`🌟 ${n}, markah anda ${r.score} daripada ${qs.length}.<br>${r.score===qs.length?"Hebat! Semua jawapan betul! 🏆":r.score>=6?"Bagus! Teruskan usaha! 💪":"Jangan putus asa. Cuba lagi, anda pasti boleh! ⭐"}<br>Masa: ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;el("result").scrollIntoView({behavior:"smooth",block:"center"})}
function restartQuiz(){qs.forEach((q,i)=>{el("ans"+i).value="";el("fb"+i).textContent="";el("card"+i).classList.remove("correct","wrong")});el("score").textContent=`0 / ${qs.length}`;el("answered").textContent=`0 / ${qs.length}`;el("result").style.display="none";started=Date.now()}
function tick(){let s=Math.floor((Date.now()-started)/1000);el("timer").textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
render();setInterval(tick,1000);
</script></body></html>
